[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paraphrasing-claim-audit"
version = "0.1.0"
description = "Offline documentation sentence restatement claim auditor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
paraphrasing-claim-audit = "paraphrasing_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["paraphrasing_claim_audit*"]
